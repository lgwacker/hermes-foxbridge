name: docker-image

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push image
        run: |
          # docker/foxbridge is the patched binary committed to the repo
          # (Fetch.enable no-op + mainframe-context fix). Do NOT rebuild
          # from upstream @latest — that would drop the patches.
          docker build -t ghcr.io/lgwacker/foxbridge-camoufox:latest docker/
          docker push ghcr.io/lgwacker/foxbridge-camoufox:latest
