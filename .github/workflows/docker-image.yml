name: docker-image

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "scripts/**"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # build-image.sh clones lgwacker/foxbridge @ FOXBRIDGE_REF (the fork
      # carries all three mandatory fixes as commits), builds the binary in a
      # throwaway golang container, and builds the image — same path as local
      # builds, no binary committed to this repo.
      - name: Build image from fork
        run: ./scripts/build-image.sh

      - name: Push image
        run: docker push ghcr.io/lgwacker/foxbridge-camoufox:latest
